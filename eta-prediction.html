<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ETA Prediction - Smart Port</title><link rel="stylesheet" href="dashboard-style.css"><link rel="stylesheet" href="logistics-style.css"><script src="config.js"></script><script src="fake-database.js"></script></head><body><div class="dashboard-container"><aside class="sidebar"><div class="sidebar-header"><div class="logo-small">📦</div><h2>Smart Port</h2></div><nav class="sidebar-nav"></nav><div class="sidebar-footer"><button class="logout-btn" onclick="logout()"><span class="nav-icon">🚪</span><span>Logout</span></button></div></aside><main class="main-content"><header class="top-header"><div class="header-left"><h1>ETA Prediction</h1><p class="subtitle">Predict arrival time from live operating conditions</p></div></header><section class="logistics-page"><div class="logistics-grid"><div class="logistics-card"><h3>Prediction inputs</h3><form id="etaForm" class="stack"><label>Distance (km)<input id="etaDistance" type="number" value="370" min="1"></label><label>Current speed (km/h)<input id="etaSpeed" type="number" value="62" min="1"></label><label>Traffic impact (km/h)<input id="etaTraffic" type="number" value="15" min="0"></label><p class="muted">Weather: Clear · Road condition: Good</p></form></div><div class="logistics-card"><h3>Expected arrival</h3><div class="metric" id="etaResult">4:30 PM</div><p id="etaDelay" class="muted">On schedule: traffic impact is low</p><div class="flow"><div class="flow-node"><strong>GPS</strong>Vellore</div><div class="flow-arrow">→</div><div class="flow-node"><strong>AI model</strong>6.1 hours</div><div class="flow-arrow">→</div><div class="flow-node"><strong>ETA</strong>Bangalore</div></div></div></div></section></main></div><script src="dashboard-script.js"></script><script src="logistics-pages.js"></script></body></html>
